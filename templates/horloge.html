<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Horloge</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Il est <span id="heure">...</span></h1>
    <p id="message"></p>

    <script>
        // Ce code s'exécute dans le navigateur, pas sur le serveur.
        async function mettreAJour() {
            try {
                const reponse = await fetch("/api/heure");
                const donnees = await reponse.json();
                document.getElementById("heure").textContent = donnees.heure;
                document.getElementById("message").textContent = donnees.message;
            } catch (erreur) {
                document.getElementById("message").textContent = "Impossible de récupérer l'heure pour le moment.";
                console.error(erreur);
            }
        }

        mettreAJour();
        setInterval(mettreAJour, 1000);
    </script>
    <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
